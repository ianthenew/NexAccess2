    <title>知山田社區｜雲端門禁教學 SOP</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&display=swap');
        
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #ebf0ec; /* 淺灰綠背景 */
            background-image: radial-gradient(#d1dfd5 1px, transparent 1px);
            background-size: 24px 24px;
        }
        
        h1, h2, .serif-font { font-family: 'Noto Serif TC', serif; }
        
        /* Custom Checkbox */
        .chk-btn { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .chk-btn.active { background-color: #065f46; border-color: #065f46; color: white; transform: scale(1.05); }
        
        /* Step Cards */
        .step-card { 
            transition: all 0.4s ease; 
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
        }
        .step-card:hover { transform: translateY(-2px) translateZ(0); will-change: transform; box-shadow: 0 10px 25px -5px rgba(6, 95, 70, 0.1); }
        .step-card.done { opacity: 0.6; background: rgba(245, 248, 246, 0.8); border-color: #d1dfd5; }
        .step-card.done .step-title { text-decoration: line-through; color: #9ca3af; }
        
        /* Timeline */
        .timeline-container::before {
            content: ''; position: absolute; top: 0; bottom: 0; left: 1.25rem;
            width: 2px; background: #a7f3d0; z-index: 0;
        }
        @media (min-width: 768px) {
            .timeline-container::before { left: 1.5rem; }
        }
    </style>
</head>

const STORE_KEY = 'zhishantian_access_key';

function decryptContent(key) {
    try {
        const bytes = CryptoJS.AES.decrypt(ciphertext, key);
        const originalText = bytes.toString(CryptoJS.enc.Utf8);
        if (originalText && (originalText.includes('<') || originalText.trim().length > 0)) {
            return originalText;
        }
    } catch (e) {
        return null;
    }
    return null;
}

function executeScripts() {
    const container = document.getElementById('decrypted-content');
    const scripts = container.getElementsByTagName('script');
    const scriptsToExecute = [];
    for (let i = 0; i < scripts.length; i++) {
        scriptsToExecute.push(scripts[i]);
    }
    
    scriptsToExecute.forEach(script => {
        const newScript = document.createElement('script');
        if (script.src) {
            newScript.src = script.src;
        } else {
            newScript.textContent = script.textContent;
        }
        document.body.appendChild(newScript);
    });
    
    setTimeout(() => {
        document.dispatchEvent(new Event('DOMContentLoaded'));
    }, 100);
}

function checkPassword() {
    const pwd = document.getElementById('password-input').value;
    const decrypted = decryptContent(pwd);
    if (decrypted) {
        document.getElementById('decrypted-content').innerHTML = decrypted;
        document.getElementById('lock-screen').style.display = 'none';
        localStorage.setItem(STORE_KEY, pwd);
        executeScripts();
    } else {
        document.getElementById('error-msg').classList.remove('hidden');
    }
}

// Auto decrypt on load
document.addEventListener('DOMContentLoaded', () => {
    const savedKey = localStorage.getItem(STORE_KEY);
    if (savedKey) {
        const decrypted = decryptContent(savedKey);
        if (decrypted) {
            document.getElementById('decrypted-content').innerHTML = decrypted;
            document.getElementById('lock-screen').style.display = 'none';
            executeScripts();
        }
    }
    
    document.getElementById('password-input').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            checkPassword();
        }
    });
});
